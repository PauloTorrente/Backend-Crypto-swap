<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histórico de Cotações</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1c1f24; --muted: #646b75;
      --border: #d9dde3; --accent: #1f6feb; --accent-text: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418; --card: #1a1e24; --text: #e6e8eb; --muted: #9aa2ad;
        --border: #2c323b; --accent: #4c8dff; --accent-text: #0b0d10;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%; max-width: 420px; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; padding: 24px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    p { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
    label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
    input {
      width: 100%; padding: 10px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    }
    .presets { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .presets button {
      flex: 1; padding: 8px; font: inherit; font-size: .85rem; cursor: pointer;
      background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    }
    .download {
      width: 100%; margin-top: 20px; padding: 12px; font: inherit; font-weight: 600; cursor: pointer;
      background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
    }
    #status { margin-top: 12px; font-size: .85rem; color: var(--muted); min-height: 1.3em; }
  </style>
</head>
<body>
  <main>
    <h1>Histórico de cotações BOB/BRL</h1>
    <p>Escolha o período e baixe os registros em .txt</p>

    <form id="form">
      <label for="from">De</label>
      <input type="datetime-local" id="from" required>
      <label for="to">Até</label>
      <input type="datetime-local" id="to" required>

      <div class="presets">
        <button type="button" data-hours="24">Últimas 24h</button>
        <button type="button" data-hours="168">7 dias</button>
        <button type="button" data-hours="720">30 dias</button>
      </div>

      <button type="submit" class="download">Baixar .txt</button>
      <div id="status"></div>
    </form>
  </main>

  <script>
    const fromInput = document.getElementById('from');
    const toInput = document.getElementById('to');
    const status = document.getElementById('status');

    // Valor no formato do datetime-local, no horário do navegador
    const toLocalInput = d => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

    function setLastHours(hours) {
      const now = new Date();
      toInput.value = toLocalInput(now);
      fromInput.value = toLocalInput(new Date(now - hours * 3600000));
    }

    document.querySelectorAll('[data-hours]').forEach(btn =>
      btn.addEventListener('click', () => setLastHours(Number(btn.dataset.hours)))
    );
    setLastHours(24);

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const from = new Date(fromInput.value);
      const to = new Date(toInput.value);
      if (from > to) {
        status.textContent = 'A data inicial precisa ser antes da final.';
        return;
      }

      const params = new URLSearchParams({
        from: from.toISOString(),
        to: to.toISOString(),
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone
      });

      status.textContent = 'Gerando arquivo...';
      try {
        const res = await fetch(`/api/rates/history/download?${params}`);
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || body.message || `Erro ${res.status}`);
        }
        const name = /filename="([^"]+)"/.exec(res.headers.get('Content-Disposition') || '')?.[1] || 'cotacoes.txt';
        const url = URL.createObjectURL(await res.blob());
        const a = Object.assign(document.createElement('a'), { href: url, download: name });
        a.click();
        URL.revokeObjectURL(url);
        status.textContent = `Arquivo ${name} baixado.`;
      } catch (err) {
        status.textContent = `Não foi possível baixar: ${err.message}`;
      }
    });
  </script>
</body>
</html>
